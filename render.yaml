# Blueprint de Render: crea el backend de LINEDU. La base de datos PostgreSQL va aparte (ver DEPLOY.md).
# Las variables con `sync: false` se cargan a mano en el panel de Render: nunca van en el repositorio.
services:
  - type: web
    name: linedu-api
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev: Render pone NODE_ENV=production y sin esto no se instalan typescript ni prisma, necesarios para compilar.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Argentina/Buenos_Aires
      - key: REMINDER_HOUR
        value: "19"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL # Neon, conexión con pooler (la usa la app)
        sync: false
      - key: DATABASE_URL_UNPOOLED # Neon, conexión directa (la usa `prisma db push` al arrancar)
        sync: false
      - key: PUBLIC_URL # https://linedu-api.onrender.com (la URL que Render asigne)
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST # para el email de recuperar contraseña (ej. smtp.gmail.com)
        sync: false
      - key: SMTP_PORT # 2525: Render gratis bloquea 25/465/587; Brevo también atiende en 2525
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
